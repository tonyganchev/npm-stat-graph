<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  
  <!-- Fills exactly 100% of the bounds with rounded corners, leaving everything outside strictly transparent -->
  <rect width="512" height="512" rx="48" fill="url(#g)" />
  
  <!-- Graph Axes: Changed to solid white with high opacity and square/miter joints for max sharpness -->
  <path d="M 80 90 L 80 432 L 422 432" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" opacity="0.75" />
  
  <!-- Data Line: Removed the intermediate circles for a continuous smooth line, 
       and adjusted coordinates so the last segment is exactly 45 degrees -->
  <path d="M 80 340 L 180 220 L 260 280 L 380 160" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Prominent Arrow Head matching the 45-degree final segment -->
  <polyline points="310,160 380,160 380,230" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
</svg>
